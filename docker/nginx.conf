# PIE web server: serves the pages and forwards the API routes the pages use to the
# backend container. Everything else on the backend (/docs, /analyze, pipeline routes,
# /kms) is not reachable from outside.
#
# Sign-in: every page and API call needs a user name and password from /etc/nginx/htpasswd
# (mounted from the server, see docker-compose.yml). The signed-in name is passed to the
# backend as X-PIE-User, so each person sees only their own chats.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    auth_basic "PIE";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Used by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-PIE-User $remote_user;
    # A chat answer can take up to PIE_LLM_TIMEOUT (90 s) plus retrieval.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages' API: chat, catalog, fields, relations, sessions, department intelligence.
    location /usage/ {
        proxy_pass http://backend:8000;
    }

    # Activity Log page.
    location /logs/api/ {
        proxy_pass http://backend:8000;
    }

    # Uptime check for the deploy pipeline and monitoring; no sign-in.
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000;
    }
}
