# Test -> build the two Docker images -> push them to Docker Hub.
# Runs on every push to main, or by hand (Actions -> Run workflow).
#
# Repository settings -> Secrets and variables -> Actions -> New repository secret:
#   DOCKERHUB_USERNAME   your Docker Hub user name
#   DOCKERHUB_TOKEN      a Docker Hub access token (Docker Hub -> Account settings -> Personal access tokens,
#                        permission "Read & Write"); not your password
#
# Images:  <DOCKERHUB_USERNAME>/pie-backend   (API, port 8080)
#          <DOCKERHUB_USERNAME>/pie-frontend  (nginx + web pages, port 80)
# Tags:    latest  and  the commit's short SHA (e.g. 85cc300), so any version can be rolled back to.

name: Build and push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run that is still building.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests -k "not real_erp" -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Short commit id
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push pie-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pie-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pie-${{ matrix.image }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
