# Test -> build the backend Docker image -> push it to Docker Hub.
# Runs on every push to main, or manually from Actions -> Run workflow.
#
# Configure these GitHub repository secrets:
#   DOCKER_USERNAME   your Docker Hub username
#   DOCKER_PASSWORD   your Docker Hub password or access token
#
# Image:
#   <DOCKER_USERNAME>/pie-backend
# Tags: latest and the commit's short SHA.

name: Build and push PIE backend to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run that is still building.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests -k "not real_erp" -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Short commit id
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push PIE backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pie-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/pie-backend:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
