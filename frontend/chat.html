<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask PIE</title>
<meta name="description" content="Marketing Intelligence Assistant: ask questions about GoodBooks ERP, answered from the PIE knowledge base in Qdrant.">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --border:#dfe3e8; --text:#17202a; --muted:#5b6673;
  --accent:#2457d6; --accent-soft:#e7eefc; --ok:#1f7a4d; --ok-soft:#e3f4ea; --warn:#9a5b00; --warn-soft:#fdf1dc;
  --bad:#a33a2b; --bad-soft:#fbe7e3; --user:#2457d6; --user-text:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#171c23; --surface-2:#1e252e; --border:#2b333e; --text:#e6eaef; --muted:#9aa5b1;
    --accent:#7ea2ff; --accent-soft:#1d2a47; --ok:#5fcf97; --ok-soft:#15301f; --warn:#f0b44c; --warn-soft:#352812;
    --bad:#f08a78; --bad-soft:#3a1d18; --user:#3561d9; --user-text:#ffffff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --surface-2:#1e252e; --border:#2b333e; --text:#e6eaef; --muted:#9aa5b1;
  --accent:#7ea2ff; --accent-soft:#1d2a47; --ok:#5fcf97; --ok-soft:#15301f; --warn:#f0b44c; --warn-soft:#352812;
  --bad:#f08a78; --bad-soft:#3a1d18; --user:#3561d9; --user-text:#ffffff; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.top-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:8px;min-width:0}
.appnav{display:flex;gap:2px;flex-wrap:wrap;margin-right:auto}
.appnav a{padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.appnav a:hover{background:var(--surface-2);color:var(--text)}
.appnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

.brand b{font-size:16px}
.brand span{color:var(--muted);font-size:12px}
select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);max-width:180px}
.btn{color:var(--text);border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.btn{color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.inline{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;color:var(--muted)}
.chip.aud{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.ctxline{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.kb{max-width:1100px;margin:0 auto;padding:0 16px 8px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.kb b{color:var(--text);font-weight:600}
.kb .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.kb .dot.off{background:var(--bad)}

/* sessions: sidebar + chat column */
.app{flex:1;display:flex;min-height:0}
.side{width:280px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0}
.newchat{justify-content:center}
.side input[type=search]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.side-list{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.side-group{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 6px 4px}
.sitem{position:relative;display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer}
.sitem:hover{background:var(--surface-2)}
.sitem[aria-current="true"]{background:var(--accent-soft)}
.sitem .t{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:58px}
.sitem small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .acts{position:absolute;right:4px;top:5px;display:none;gap:2px}
.sitem:hover .acts,.sitem:focus-within .acts,.sitem[aria-current="true"] .acts{display:flex}
.sitem .acts span{font-size:12px;padding:2px 5px;border-radius:5px;color:var(--muted);cursor:pointer}
.sitem .acts span:hover{background:var(--surface);color:var(--text)}
.side-empty{color:var(--muted);font-size:12.5px;padding:10px 6px}
.side-foot{font-size:12px;padding:4px 2px}
.chatcol{flex:1;display:flex;flex-direction:column;min-width:0}
.chatbar{flex:none;border-bottom:1px solid var(--border);background:var(--surface)}
.chatbar-inner{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chat-title{border:0;background:none;font-weight:650;font-size:15px;padding:2px 6px;margin-left:-6px;border-radius:6px;cursor:text;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-title:hover{background:var(--surface-2)}
.side-toggle{display:none}
@media (max-width:900px){
  .side-toggle{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.18)}
  .side.open{transform:none}
}
main{flex:1;overflow:auto}
.thread{max-width:900px;margin:0 auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:16px}
.empty{padding:28px 0 8px;text-align:center}
.empty h1{font-size:22px;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:560px}
.prompts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;text-align:left}
.prompt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.prompt:hover{border-color:var(--accent)}
.prompt small{display:block;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

.msg{display:flex;flex-direction:column;gap:6px}
.msg.user{align-items:flex-end}
.bubble{background:var(--user);color:var(--user-text);padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:min(680px,88%);white-space:pre-wrap;word-wrap:break-word}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;max-width:100%}
.card-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge.grounded{background:var(--ok-soft);color:var(--ok)}
.badge.partial,.badge.unverified{background:var(--warn-soft);color:var(--warn)}
.badge.not_found{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:8px;padding:8px 12px;font-size:13px;margin:10px 0 0;background:var(--warn-soft);color:var(--warn)}
.note ul{margin:4px 0 0;padding-left:18px}

.md{overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{margin:14px 0 6px;line-height:1.3}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:15px}.md h4{font-size:14px}
.md > :first-child{margin-top:0}
.md p{margin:8px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--surface-2);padding:10px;border-radius:8px;overflow:auto}
.md pre code{background:none;padding:0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
.cite{display:inline-block;font-size:10.5px;font-weight:600;line-height:1;padding:3px 5px;margin:0 1px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;vertical-align:1px}
.cite:hover{filter:brightness(.95)}

details.sources{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
details.sources summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.src{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12.5px;transition:background .6s}
.src.flash{background:var(--accent-soft)}
.src .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.src .ref{font-weight:700;color:var(--accent)}
.src .st{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px}
.st.VERIFIED,.st.OBSERVED{background:var(--ok-soft);color:var(--ok)}
.st.REVIEW,.st.AI{background:var(--warn-soft);color:var(--warn)}
.src .txt{color:var(--muted);margin-top:4px}
.src code{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.src .rel{font-size:11.5px;margin-left:auto;white-space:nowrap}

/* "How PIE answered": the answer trace */
details.trace{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
details.trace > summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:step}
.steps > li{position:relative;padding:0 0 12px 30px;counter-increment:step}
.steps > li::before{content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps > li::after{content:"";position:absolute;left:9.5px;top:22px;bottom:2px;width:1px;background:var(--border)}
.steps > li:last-child::after{display:none}
.steps .sname{font-weight:650;text-transform:capitalize}
.steps .ssum{color:var(--text);font-size:13px;margin:2px 0 4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}
.q{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;margin:2px 3px 2px 0}
.ttable{overflow-x:auto;margin-top:6px}
.ttable table{border-collapse:collapse;width:100%;font-size:12px}
.ttable th,.ttable td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
.ttable th{color:var(--muted);font-weight:600;background:var(--surface-2)}
.ttable tr.dim td{color:var(--muted)}
.ttable .num{text-align:right;font-variant-numeric:tabular-nums}
.yes{color:var(--ok);font-weight:700}
.trace pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:8px;padding:10px;font-size:11.5px;max-height:420px;overflow:auto}
.trace h4{margin:14px 0 4px;font-size:13px}
.card-foot{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.card-foot .spacer{margin-left:auto}

.loading{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.3;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.7}}
.error{border-color:var(--bad)}
.error .md{color:var(--bad)}

footer.composer{flex:none;background:var(--surface);border-top:1px solid var(--border)}
.composer-inner{max-width:900px;margin:0 auto;padding:10px 16px 12px}
.suggest{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.suggest button{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.inputrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:180px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);line-height:1.4}
.hint{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px;margin-top:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){
  .brand{flex-basis:100%}
  .hide-sm{display:none}
  .bubble{max-width:94%}
}
</style>
<!--PIE_CHAT_CONFIG-->
<script src="config.js"></script>
<script src="modules.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>Ask PIE</b><span>Marketing Intelligence Assistant · answers from the PIE knowledge base</span></div>
<nav class="appnav" id="appnav" aria-label="PIE pages"><a href="index.html">Home</a><a href="chat.html" aria-current="page">Ask PIE</a><a href="catalog.html">Feature Catalog</a><a href="fields.html">Field Explorer</a><a href="relations.html">Relationships</a><a href="logs.html">Activity Log</a><a href="intelligence.html">Department Knowledge</a></nav>
    <div id="modules" aria-label="Limit answers to one or more modules"></div>
    <label class="inline ctx" title="Who the answer is written for: it changes the style and level of detail, never the facts">For
      <select id="audience" aria-label="Answer for"><option value="marketing">Marketing Team</option><option value="client">Client</option><option value="developer">Developer</option><option value="stakeholder">Stakeholder</option></select></label>
    <select id="client-type" aria-label="Client type" hidden><option value="nontechnical">Non-technical client</option><option value="technical">Technical client</option></select>
    <label class="inline" title="Also use knowledge that still needs product review"><input type="checkbox" id="include-review"> <span class="hide-sm">Include unconfirmed</span></label>
    <button class="btn small side-toggle" id="side-toggle" type="button" aria-controls="side" aria-expanded="false">☰ Chats</button>
    <button class="btn small" id="theme" type="button" aria-label="Toggle colour theme">◐</button>
  </div>
  <div class="kb" id="kb" aria-live="polite"><span>Connecting to the knowledge base…</span></div>
</header>

<div class="app">
<aside class="side" id="side" aria-label="Chats">
  <button class="btn primary newchat" id="new-chat" type="button">+ New chat</button>
  <input type="search" id="chat-search" placeholder="Search chats…" aria-label="Search chats" autocomplete="off">
  <div class="side-list" id="chat-list"></div>
  <label class="inline side-foot"><input type="checkbox" id="show-archived"> Show archived chats</label>
</aside>
<div class="chatcol">
<div class="chatbar"><div class="chatbar-inner">
  <button class="chat-title" id="chat-title" type="button" title="Rename this chat">New chat</button>
  <span id="chat-ctx"></span>
</div></div>
<main id="main">
  <div class="thread" id="thread" aria-live="polite"></div>
</main>

<footer class="composer">
  <div class="composer-inner">
    <div class="suggest" id="suggest" aria-label="Suggested questions"></div>
    <form class="inputrow" id="form">
      <label class="sr-only" for="input">Your question</label>
      <textarea id="input" rows="1" maxlength="2000" placeholder="Ask about features, industries, demos, differentiators, gaps or tickets…"></textarea>
      <button class="btn primary" id="send" type="submit">Send</button>
    </form>
    <div class="hint"><span>Answers use only PIE knowledge and cite it. Check ⚠ items with product before external use.</span><span id="count">0/2000</span></div>
  </div>
</footer>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const SUGGESTIONS = [
    ["Feature discovery", "Give me the feature list of the modules."],
    ["Industry targeting", "What features should I highlight for the pump industry?"],
    ["Demo preparation", "Prepare a demo flow for a pump industry's IT Manager."],
    ["Differentiation", "What are our key product differentiators?"],
    ["Market gaps", "What product features are missing or in demand?"],
    ["Ticket analysis", "What are the top issues reported in our software?"],
    ["Feature discovery", "What are the key features available in the Inventory module?"],
    ["Industry targeting", "What business problems can our ERP solve for the pump industry?"],
    ["Content creation", "Write a brochure page for the Inventory module."],
    ["How-to", "How do I create a Bill of Materials?"],
    ["Business process", "Explain the end-to-end process from gate entry to stock."],
    ["Developer", "Where is the BOM validated before saving, and which line throws the error?"],
  ];
  const GROUNDING = {
    grounded: "Grounded in PIE knowledge",
    partial: "Partly grounded: some knowledge missing",
    unverified: "No citations: verify before use",
    not_found: "Not found in knowledge base",
  };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = {
    get(k, d){ try{ const v = localStorage.getItem("pie-chat:" + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem("pie-chat:" + k, JSON.stringify(v)); }catch(e){} },
  };
  let messages = [];   // the open chat: {role, content, response?, error?, ts}
  // ---- module scope: one, several or all modules (?modules=ess,inventory in the address)
  const moduleLabel = m => m.length <= 4 ? m.toUpperCase() : m.charAt(0).toUpperCase() + m.slice(1);
  const legacy = store.get("module", "");
  const picker = PieModules.create($("modules"), {
    title: "Answer from modules",
    selected: PieModules.fromUrl() || store.get("modules", legacy ? [legacy] : []),
    onChange: sel => { store.set("modules", sel); renderChatbar(); },
  });

  // ---- audience: who the answer is for (?audience=developer or client_technical in the address).
  // It stays for the whole conversation until changed; it changes presentation, never the knowledge.
  const AUDIENCE_LABELS = {marketing: "Marketing Team", client_nontechnical: "Client (non-technical)",
                           client_technical: "Client (technical)", developer: "Developer", stakeholder: "Stakeholder"};
  function setAudience(key){
    key = AUDIENCE_LABELS[key] ? key : "marketing";
    const isClient = key.startsWith("client_");
    $("audience").value = isClient ? "client" : key;
    $("client-type").value = isClient ? key.slice(7) : $("client-type").value;
    $("client-type").hidden = !isClient;
  }
  const audience = () => $("audience").value === "client" ? "client_" + $("client-type").value : $("audience").value;
  function audienceChanged(){
    $("client-type").hidden = $("audience").value !== "client";
    store.set("audience", audience());
    const u = new URLSearchParams(location.search); u.set("audience", audience());
    history.replaceState(history.state, "", location.pathname + "?" + u.toString().replace(/%2C/g, ",") + location.hash);
    if (!messages.length) render();
    else { toast("Next answers are for: " + AUDIENCE_LABELS[audience()]); renderChatbar(); }
  }
  setAudience(new URLSearchParams(location.search).get("audience") || store.get("audience", "marketing"));
  $("audience").addEventListener("change", audienceChanged);
  $("client-type").addEventListener("change", audienceChanged);
  // Conversations are stored on the PIE server as chat sessions; the browser only remembers which one is open.
  function saveMessages(){ store.set("session", current ? current.sessionId : null); }
  let busy = false;
  let justAnswered = false;
  // Backend address: an exported file's embedded setting, else frontend/config.js.
  const API = (b => b && !b.endsWith("/") ? b + "/" : b)((window.__PIE_CHAT__ && window.__PIE_CHAT__.apiBase) || (window.PIE_CONFIG && window.PIE_CONFIG.apiBase) || "");
  const API_BASE = API;
  const serverless = !API_BASE;
  // Exported copies point their page links at the PIE server; the bare template hides them.
  // An exported chat file travels alone: the other pages are not next to it.
  if (window.__PIE_CHAT__) $("appnav").hidden = true;

  // ---- chat sessions (stored on the server; each has its own history, modules and audience)
  // The owner is the signed-in user when the web server passes one (X-PIE-User), else this browser's id.
  let userId = store.get("userId", "");
  if (!userId){ userId = "u-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); store.set("userId", userId); }
  let current = null;          // the open session (null = a new chat, created on the first question)

  // ---- safe Markdown (escape first, then a small subset)
  function inline(s){
    return s
      .replace(/&lt;br\s*\/?&gt;/gi, "<br>")   // models put <br> in table cells; the rest stays escaped
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")

  }
  const LIST_RE = /^\s*([-*•]|\d+[.)])\s+/;
  const indentOf = l => l.match(/^\s*/)[0].replace(/\t/g, "    ").length;
  // Parses a list starting at lines[i] with the given indent; deeper-indented list
  // lines become nested lists; a blank line followed by a sibling item continues it.
  function parseList(lines, i, indent){
    const first = lines[i];
    const ordered = /^\s*\d+[.)]\s+/.test(first);
    const start = ordered ? parseInt(first.trim(), 10) : 1;
    const items = [];
    while (i < lines.length){
      const line = lines[i];
      if (!line.trim()){
        let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && LIST_RE.test(lines[j]) && indentOf(lines[j]) >= indent){ i = j; continue; }
        break;
      }
      const ind = indentOf(line);
      if (LIST_RE.test(line) && ind === indent){

      }
      if (ind > indent && items.length){
        if (LIST_RE.test(line)){ const r = parseList(lines, i, ind); items[items.length - 1].children += r.html; i = r.next; continue; }
        items[items.length - 1].text += " " + line.trim(); i++; continue;
      }
      break;

    const lis = items.map(it => `<li>${inline(it.text)}${it.children}</li>`).join("");
    const html = ordered ? `<ol${start > 1 ? ` start="${start}"` : ""}>${lis}</ol>` : `<ul>${lis}</ul>`;

  }
  function markdown(src){
    const lines = esc(src).replace(/\r/g, "").split("\n");
    const out = []; let i = 0;
    while (i < lines.length){
      const line = lines[i];
      if (/^```/.test(line)){ const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${buf.join("\n")}</code></pre>`); continue; }
      const h = line.match(/^(#{1,4})\s+(.*)$/); if (h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
        const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));

  function sourceHtml(s, idx){

  // ---- API

  async function ask(question){
    question = question.trim();

    if (serverless){ toast("This copy has no PIE server address. See the note at the top."); return; }
    const history = historyForApi();
    messages.push({role: "user", content: question, ts: Date.now()});
    busy = true; render(); saveMessages();
    const started = Date.now();
    const tick = setInterval(() => { const el = $("loading-text"); if (el) el.textContent = `Searching the PIE knowledge base and writing an answer… ${Math.round((Date.now() - started) / 1000)}s`; }, 1000);
    try{
      const r = await fetch(API_BASE + "api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: question, history, modules: picker.get(), audience: audience(), includeReview: $("include-review").checked,
          userId, ...(current ? {sessionId: current.sessionId} : {newSession: true})})});
      const data = await r.json().catch(() => ({}));
      if (!r.ok){
        const d = data.detail;
        // FastAPI validation errors are a list of {loc, msg}; show them as text.
        const text = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => `${(x.loc || []).slice(1).join(" ")}: ${x.msg}`).join("; ") : "";
        throw new Error(text || `Request failed (${r.status})`);
      }
      messages.push({role: "assistant", response: data, ts: Date.now()});
      if (data.session){ current = {...(current || {}), ...data.session}; loadSessions(); }
    }catch(e){
      const reason = e instanceof TypeError
        ? `the PIE server${API_BASE ? " at " + API_BASE : ""} did not respond. Check that it is running; if it is, restart it (Ctrl+C, then start uvicorn again) so it loads the current version`
        : e.message;
      messages.push({role: "assistant", error: `PIE could not answer: ${reason}`, question, ts: Date.now()});
    }finally{
      clearInterval(tick); busy = false; justAnswered = true; saveMessages(); render();
    }
  }
  async function loadStatus(){
    try{
      const r = await fetch(API_BASE + "api/chat/status"); const s = await r.json();
      if (!r.ok) throw new Error(s.detail || r.status);
      const types = s.byType || {};
      $("kb").innerHTML = `<span><span class="dot"></span>Qdrant <b>${esc(s.collection)}</b>: <b>${esc(s.points.toLocaleString())}</b> knowledge items</span>
        <span title="${esc(s.verifiedModules.join(", "))}">Verified analysis: <b>${s.verifiedModules.length > 4 ? esc(s.verifiedModules.length + " modules") : esc(s.verifiedModules.join(", ") || "none")}</b></span>
        <span>Tickets: <b>${esc(s.tickets)}</b></span><span>AI: <b>${esc(s.llm)}</b></span>`;
      const ordered = [...s.verifiedModules, ...s.modules.filter(m => !s.verifiedModules.includes(m))];
      picker.setOptions(ordered.map(m => ({value: m, label: moduleLabel(m), note: s.verifiedModules.includes(m) ? "✓ verified" : ""})));
      void types;
    }catch(e){
      const where = API_BASE ? ` at ${esc(API_BASE)}` : "";
      $("kb").innerHTML = `<span><span class="dot off"></span>Cannot reach the PIE server${where}. Check that it is running; if it is, restart it so it loads the current version.</span>`;
    }
  }

  // ---- events
  const input = $("input");
  function grow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; $("count").textContent = `${input.value.length}/2000`; }
  input.addEventListener("input", grow);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("form").requestSubmit(); } });
  $("form").addEventListener("submit", e => { e.preventDefault(); const q = input.value; input.value = ""; grow(); ask(q); });
  document.addEventListener("click", e => {
    const q = e.target.closest("[data-q]"); if (q){ ask(q.dataset.q); return; }
    const c = e.target.closest(".cite");
    if (c){
      const card = c.closest(".msg"); const det = card && card.querySelector("details.sources");
      if (det){ det.open = true; const el = det.querySelector(`[id$="-${c.dataset.ref}"]`); if (el){ el.scrollIntoView({block: "nearest", behavior: "smooth"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 900); } }
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp){ const m = messages[+cp.dataset.copy]; if (m && m.response) copy(m.response.answer.replace(/\s?\[K\d+\]/g, "")); return; }
    const rt = e.target.closest("[data-retry]");
    if (rt){ const m = messages[+rt.dataset.retry]; if (m){ messages.splice(+rt.dataset.retry - 1, 2); ask(m.question || ""); } }
  });
  $("include-review").checked = store.get("includeReview", false);
  $("include-review").addEventListener("change", e => store.set("includeReview", e.target.checked));
  async function copy(text){
    try{ await navigator.clipboard.writeText(text); toast("Answer copied"); }
    catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Answer copied"); }catch(_){ toast("Copy failed"); } ta.remove(); }
  }

  if (serverless){
    $("kb").innerHTML = `<span><span class="dot off"></span>No backend address is configured. Set apiBase in frontend/config.js (for example http://localhost:8000/usage/).</span>`;
  } else {
    loadStatus();
  }
  render(); input.focus();
  (async () => {
    if (!serverless){
      // Reopen the chat that was open last (or move an old browser-only conversation into a saved chat).
      const last = store.get("session", null) || await importLocalConversation();
      if (last) await openSession(last);
      await loadSessions();
    } else renderSessions();
    const qParam = new URLSearchParams(location.search).get("q");
    if (qParam && !serverless){ history.replaceState(null, "", location.pathname); if (current) newChat(); ask(qParam); }
  })();
})();
</script>
</body>
</html>
