[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pie-agent"
version = "0.19.0"
description = "Evidence-driven Product Intelligence Content Preparation Agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "PyMuPDF>=1.24",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "SQLAlchemy>=2.0",
  "pyodbc>=5.1"
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
pie-agent = "pie_agent.cli:main"

